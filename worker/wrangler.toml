name = "task-management-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Public env vars (visible in code via c.env.*)
[vars]
FIREBASE_PROJECT_ID = "task-management-pro-2026"
ALLOWED_ORIGIN = "http://localhost:3000,https://main.d1oq00m5o7x4xo.amplifyapp.com"
PUBLIC_FILES_BASE_URL = ""
# Email — ưu tiên Gmail SMTP: cần GMAIL_USER (dưới đây) + secret GMAIL_APP_PASSWORD
# (App Password của chính tài khoản GMAIL_USER, tạo tại https://myaccount.google.com/apppasswords).
# Secret KHÔNG đặt ở đây. Local: thêm GMAIL_APP_PASSWORD=... vào worker/.dev.vars
# Production: chạy `wrangler secret put GMAIL_APP_PASSWORD`
GMAIL_USER = "vunhatjp@gmail.com"
MAIL_FROM_NAME = "Task Management"
# Dự phòng Resend (chỉ dùng khi chưa có GMAIL_APP_PASSWORD; MAIL_FROM phải thuộc domain đã xác minh trên Resend)
MAIL_FROM = "vunhatjp@gmail.com"
# APP_BASE_URL = "http://localhost:3000"
APP_BASE_URL = "https://main.d1oq00m5o7x4xo.amplifyapp.com"
# Danh sách email được tự cấp quyền admin hệ thống (phân tách bằng dấu phẩy).
# Khi các email này đăng nhập, role trong bảng users sẽ tự được set 'admin'.
ADMIN_EMAILS = "vudungit92@gmail.com"

# D1 database — bound as `DB` in code (c.env.DB)
[[d1_databases]]
binding = "DB"
database_name = "task-management"
database_id = "a0dff048-6dbc-4227-a225-3e04ae0c22dc"
migrations_dir = "migrations"

# R2 bucket — bound as `FILES` in code (c.env.FILES)
[[r2_buckets]]
binding = "FILES"
bucket_name = "task-management-files"
